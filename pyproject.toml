[project]
name = "distributed-task-queue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mihail", email = "mihuil_00@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "python-dotenv",
    "redis",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[project.scripts]
distributed-task-queue = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["app", "config", "main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "repository*", "taskqueue*"]
